# TEMPLATE — copy to .gitea/workflows/docker.yaml (v*.*.* tag → release image).

name: Push Docker

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    uses: private/ci/.gitea/workflows/docker-publish.yaml@v1
    with:
      mode: release
      image-target: ${{ vars.DOCKERHUB_TARGET }}

      # ▼ ADJUST PER REPO — see develop.yaml; task-weaver only.
      # build-backend: 'bake'

    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
